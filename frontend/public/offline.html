<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrukAll - Offline</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #09090b;
            color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .offline-container {
            padding: 2rem;
        }
        .truck-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #f59e0b;
        }
        p {
            font-size: 1.1rem;
            color: #a1a1aa;
            margin-bottom: 2rem;
        }
        button {
            background: #f59e0b;
            color: #000;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 0.5rem;
            cursor: pointer;
        }
        button:hover {
            background: #d97706;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="truck-icon">🚛</div>
        <h1>You're Offline</h1>
        <p>TrukAll needs an internet connection to load fresh data.<br>Your cached data is still available.</p>
        <button onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
